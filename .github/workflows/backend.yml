name: Backend CI

on:
  pull_request:
    branches:
      - main

# Cancel superseded runs for the same PR or branch. Runs on main get a
# unique group, so they are never cancelled or queued. See docs/CI.md.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && format('run-{0}', github.run_id) || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend lint and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Restore backend node_modules cache
        uses: actions/cache@v4
        with:
          path: backend/node_modules
          key: backend-node-modules-${{ runner.os }}-${{ hashFiles('backend/package-lock.json') }}

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend lint
        working-directory: backend
        run: npm run lint

      - name: Run backend tests
        working-directory: backend
        run: npm test

      - name: Check generated OpenAPI specification is current
        working-directory: backend
        run: npm run check:openapi

      - name: Validate OpenAPI specification
        working-directory: backend
        run: npm run validate:openapi
