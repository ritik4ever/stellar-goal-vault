name: CI - Build Checks

on:
  push:
    branches:
      - main
  pull_request:


jobs:
  backend-build:
    name: Backend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Lint backend
        working-directory: backend
        run: npm run lint

      - name: Audit backend dependencies
        working-directory: backend
        run: npm audit --audit-level=high
        continue-on-error: false

      - name: Upload backend audit report
        if: always()
        run: npm audit --json --audit-level=none > /tmp/backend-audit.json 2>&1 || true
        working-directory: backend

      - name: Upload backend audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-build-npm-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/backend-audit.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Collect backend npm debug logs
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/diagnostics"
          cp ~/.npm/_logs/*.log "$RUNNER_TEMP/diagnostics/" 2>/dev/null || true

      - name: Upload backend diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-build-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/diagnostics/*.log
          retention-days: 7
          if-no-files-found: ignore

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Collect frontend npm debug logs
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/diagnostics"
          cp ~/.npm/_logs/*.log "$RUNNER_TEMP/diagnostics/" 2>/dev/null || true

      - name: Upload frontend diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/diagnostics/*.log
          retention-days: 7
          if-no-files-found: ignore

  format-check:
    name: Prettier Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm install

      - name: Run prettier format check
        run: npm run format:check

  contract-build:
    name: Contract Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build contract
        working-directory: contracts
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/diagnostics"
          cargo build --target wasm32-unknown-unknown --release 2>&1 | tee "$RUNNER_TEMP/diagnostics/cargo-build.log"

      - name: Upload contract WASM binary
        uses: actions/upload-artifact@v4
        with:
          name: contract-build-wasm-${{ github.run_id }}-${{ github.run_attempt }}
          path: contracts/target/wasm32-unknown-unknown/release/*.wasm
          retention-days: 7
          if-no-files-found: ignore

      - name: Run contract tests
        working-directory: contracts
        run: |
          set -o pipefail
          cargo test 2>&1 | tee "$RUNNER_TEMP/diagnostics/cargo-test.log"

      - name: Upload contract build and test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: contract-build-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/diagnostics/*.log
          retention-days: 7
          if-no-files-found: ignore

