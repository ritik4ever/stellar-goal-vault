name: Lighthouse CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install root deps
        run: npm ci

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Serve built frontend
        run: |
          npx --yes http-server frontend/dist -p 8080 -c-1 &

      - name: Wait for server
        run: npx wait-on http://127.0.0.1:8080

      - name: Run Lighthouse
        id: run-lighthouse
        run: |
          npx --yes lighthouse http://127.0.0.1:8080 --output=json --output-path=./lhreport.json --chrome-flags="--no-sandbox" || true

      - name: Generate summary
        id: gen-summary
        run: |
          apt-get update && apt-get install -y jq bc >/dev/null
          SCORE=$(jq -r '.categories.performance.score * 100' lhreport.json)
          LCP=$(jq -r '.audits["largest-contentful-paint"].numericValue' lhreport.json)
          FID=$(jq -r '.audits["max-potential-fid"].numericValue' lhreport.json)
          CLS=$(jq -r '.audits["cumulative-layout-shift"].numericValue' lhreport.json)
          cat > lhci-summary.md <<EOF
## Lighthouse CI summary

- Performance score: ${SCORE}
- Largest Contentful Paint (ms): ${LCP}
- Max potential First Input Delay (ms): ${FID}
- Cumulative Layout Shift: ${CLS}

EOF
          PASS=1
          python3 - <<PY
import sys
S=float(sys.argv[1])
L=float(sys.argv[2])
F=float(sys.argv[3])
C=float(sys.argv[4])
ok=True
if S<85: ok=False
if L>2500: ok=False
if F>100: ok=False
if C>0.1: ok=False
print('0' if ok else '1')
PY ${SCORE:-0} ${LCP:-99999} ${FID:-99999} ${CLS:-99999} > _passcode
          PASS=$(cat _passcode)
          if [ "$PASS" = "1" ]; then echo "Lighthouse budget passed" > lhci-result; else echo "Lighthouse budget failed" > lhci-result; fi
          if [ "$PASS" != "1" ]; then exit 1; fi

      - name: Comment PR with summary
        if: ${{ github.event_name == 'pull_request' }}
        uses: peter-evans/create-or-update-comment@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body-file: lhci-summary.md

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report-json
          path: lhreport.json
name: Lighthouse CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v10
        with:
          configPath: ./frontend/lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Comment PR with Lighthouse scores
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const resultsPath = './lhr.json';
            
            if (!fs.existsSync(resultsPath)) {
              console.log('Lighthouse results not found');
              return;
            }
            
            const results = JSON.parse(fs.readFileSync(resultsPath, 'utf8'));
            const { categories } = results;
            
            const scores = {
              'Performance': categories.performance.score * 100,
              'Accessibility': categories.accessibility.score * 100,
              'Best Practices': categories['best-practices'].score * 100,
              'SEO': categories.seo.score * 100,
            };
            
            const thresholds = {
              'Performance': 80,
              'Accessibility': 90,
              'Best Practices': 90,
            };
            
            let comment = '## ⚡ Lighthouse CI Results\n\n';
            comment += '| Category | Score | Threshold | Status |\n';
            comment += '|----------|-------|-----------|--------|\n';
            
            let allPassed = true;
            Object.entries(scores).forEach(([category, score]) => {
              const threshold = thresholds[category];
              const status = threshold ? (score >= threshold ? '✅' : '❌') : '⏭️';
              const displayScore = `${Math.round(score)}`;
              const displayThreshold = threshold ? `${threshold}` : 'N/A';
              
              if (threshold && score < threshold) {
                allPassed = false;
              }
              
              comment += `| ${category} | ${displayScore} | ${displayThreshold} | ${status} |\n`;
            });
            
            comment += '\n';
            if (allPassed) {
              comment += '✨ All performance budgets met!';
            } else {
              comment += '⚠️ Some performance budgets were not met. Please review and optimize.';
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment,
            });
