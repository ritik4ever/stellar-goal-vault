name: Storybook Tests

on:
  push:
    branches: [main, feat/storybook-ui-components]
    paths:
      - 'frontend/**'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'

jobs:
  storybook-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Storybook
        run: npm run build-storybook

      # Storybook 10 removed the `storybook test-runner` command; its
      # replacement is the Vitest-based `storybook test`, which requires
      # @storybook/addon-vitest and therefore Vitest 3, while the project is on
      # Vitest 1. Building Storybook is the check that matters here: it
      # compiles every story and the preview, so a broken story fails the
      # build. The stories' own behaviour is covered by the Vitest suite.
      - name: Verify the Storybook build output
        run: test -f storybook-static/index.html
