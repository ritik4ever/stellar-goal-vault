name: Backend Integration Tests

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - ".github/workflows/backend-integration-tests.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/**"

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    name: API Integration Suite (${{ matrix.node-version }})

    strategy:
      matrix:
        node-version: [18.x, 20.x]
      fail-fast: false

    env:
      CI: true
      NODE_ENV: test
      # Do not set a shared DB_PATH — each fork allocates an isolated temp database.
      VITEST_INTEGRATION_MAX_FORKS: "2"
      VITEST_INTEGRATION_COVERAGE_DIR: coverage-integration-${{ matrix.node-version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: "backend/package-lock.json"

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run API integration suite (parallel-safe forks)
        working-directory: backend
        run: npm run test:integration -- --coverage

      - name: Upload integration coverage HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-integration-coverage-${{ matrix.node-version }}
          path: backend/coverage-integration-${{ matrix.node-version }}
          if-no-files-found: ignore

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v3
        with:
          files: ./backend/coverage-integration-${{ matrix.node-version }}/coverage-final.json
          flags: backend-integration
          name: backend-integration-coverage-${{ matrix.node-version }}

      - name: Clean up test databases
        if: always()
        run: |
          rm -f /tmp/stellar-goal-vault-*.db /tmp/stellar-goal-vault-*.db-shm /tmp/stellar-goal-vault-*.db-wal

  test-results:
    runs-on: ubuntu-latest
    name: Test Results Summary
    needs: integration-tests
    if: always()

    steps:
      - name: Test Status
        run: |
          if [ "${{ needs.integration-tests.result }}" == "success" ]; then
            echo "All API integration tests passed"
            exit 0
          else
            echo "API integration tests failed"
            exit 1
          fi
