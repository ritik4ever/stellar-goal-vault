openapi: 3.1.0
info:
  title: Stellar Goal Vault API
  description: Machine-readable OpenAPI specification for the Stellar Goal Vault backend.
  version: 1.0.0
servers:
  - url: http://localhost:3001
    description: Local development server
  - url: /
    description: Relative server URL
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
      description: Use the API key as a Bearer token in the Authorization header.
  schemas:
    Campaign:
      type: object
      properties:
        id:
          type: string
          description: Numeric campaign identifier.
          example: "1"
        creator:
          type: string
          pattern: ^G[A-Z2-7]{55}$
          description: A 56-character Stellar public key (G...).
          example: GAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
        title:
          type: string
          example: Clean Water Initiative
        description:
          type: string
          example: Raising funds to provide clean water access.
        acceptedTokens:
          type: array
          items:
            type: string
            pattern: ^[A-Z0-9]{1,12}$
            description: Accepted Stellar asset code.
            example: USDC
          example: &a1
            - USDC
            - XLM
        assetCode:
          type: string
          pattern: ^[A-Z0-9]{1,12}$
          description: Primary asset code (backward compatibility).
          example: USDC
        targetAmount:
          type: number
          exclusiveMinimum: 0
          example: 1000
        pledgedAmount:
          type: number
          example: 455
        deadline:
          type: integer
          exclusiveMinimum: 0
          description: Unix timestamp in seconds.
          example: 1735689600
        createdAt:
          type: integer
          exclusiveMinimum: 0
          description: Unix timestamp in seconds.
          example: 1735689600
        claimedAt:
          type: integer
          exclusiveMinimum: 0
          description: Unix timestamp in seconds.
          example: 1735689600
        failedAt:
          type: integer
          exclusiveMinimum: 0
          description: Unix timestamp in seconds.
          example: 1735689600
        deletedAt:
          type: integer
          exclusiveMinimum: 0
          description: Unix timestamp in seconds.
          example: 1735689600
        metadata:
          type: object
          properties:
            imageUrl:
              type: string
              format: uri
            externalLink:
              type: string
              format: uri
          description: Optional campaign media / link metadata.
        maxPerContributor:
          type: integer
          exclusiveMinimum: 0
          example: 500
        tokenBalances:
          type: object
          additionalProperties:
            type: number
          example: &a2
            USDC: 455
            XLM: 0
        progress:
          $ref: "#/components/schemas/CampaignProgress"
        pledges:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              campaignId:
                type: string
              contributor:
                type: string
                pattern: ^G[A-Z2-7]{55}$
                description: A 56-character Stellar public key (G...).
                example: GAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
              amount:
                type: number
                exclusiveMinimum: 0
              assetCode:
                type: string
                pattern: ^[A-Z0-9]{1,12}$
                description: Accepted Stellar asset code.
                example: USDC
              createdAt:
                type: integer
                exclusiveMinimum: 0
                description: Unix timestamp in seconds.
                example: 1735689600
              refundedAt:
                type: integer
                exclusiveMinimum: 0
                description: Unix timestamp in seconds.
                example: 1735689600
              transactionHash:
                type: string
            required:
              - id
              - campaignId
              - contributor
              - amount
              - assetCode
              - createdAt
          description: Recent pledges included on campaign detail responses.
      required:
        - id
        - creator
        - title
        - description
        - acceptedTokens
        - assetCode
        - targetAmount
        - pledgedAmount
        - deadline
        - createdAt
        - progress
    CampaignProgress:
      type: object
      properties:
        status:
          type: string
          enum:
            - open
            - funded
            - claimed
            - failed
          example: open
        percentFunded:
          type: number
          example: 45.5
        remainingAmount:
          type: number
          example: 54.5
        pledgeCount:
          type: integer
          example: 12
        hoursLeft:
          type: number
          example: 72
        canPledge:
          type: boolean
          example: true
        canClaim:
          type: boolean
          example: false
        canRefund:
          type: boolean
          example: false
      required:
        - status
        - percentFunded
        - remainingAmount
        - pledgeCount
        - hoursLeft
        - canPledge
        - canClaim
        - canRefund
    Pledge:
      type: object
      properties:
        id:
          type: integer
          example: 1
        campaignId:
          type: string
          example: "1"
        contributor:
          type: string
          pattern: ^G[A-Z2-7]{55}$
          description: A 56-character Stellar public key (G...).
          example: GAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
        amount:
          type: number
          exclusiveMinimum: 0
          example: 50
        assetCode:
          type: string
          pattern: ^[A-Z0-9]{1,12}$
          description: Accepted Stellar asset code.
          example: USDC
        createdAt:
          type: integer
          exclusiveMinimum: 0
          description: Unix timestamp in seconds.
          example: 1735689600
        refundedAt:
          type: integer
          exclusiveMinimum: 0
          description: Unix timestamp in seconds.
          example: 1735689600
        transactionHash:
          type: string
      required:
        - id
        - campaignId
        - contributor
        - amount
        - assetCode
        - createdAt
    CampaignEvent:
      type: object
      properties:
        id:
          type: integer
          example: 1
        campaignId:
          type: string
          example: "1"
        eventType:
          type: string
          enum:
            - created
            - pledged
            - claimed
            - refunded
            - updated
            - metadata_updated
            - pledge_limit_reached
          example: pledged
        timestamp:
          type: integer
          exclusiveMinimum: 0
          description: Unix timestamp in seconds.
          example: 1735689600
        actor:
          type: string
          pattern: ^G[A-Z2-7]{55}$
          description: A 56-character Stellar public key (G...).
          example: GAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
        amount:
          type: number
          exclusiveMinimum: 0
          example: 50
        metadata:
          type: object
          additionalProperties: {}
        blockchainMetadata:
          type: object
          properties:
            txHash:
              type: string
            ledgerNumber:
              type: integer
            ledgerCloseTime:
              type: integer
            eventIndex:
              type: integer
            contractId:
              type: string
            source:
              type: string
              enum:
                - local
                - soroban
      required:
        - id
        - campaignId
        - eventType
        - timestamp
    ContributorSummary:
      type: object
      properties:
        contributor:
          type: string
          pattern: ^G[A-Z2-7]{55}$
          description: A 56-character Stellar public key (G...).
          example: GAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
        totalPledged:
          type: number
          example: 150
        refundedAmount:
          type: number
          example: 0
        isFullyRefunded:
          type: boolean
          example: false
      required:
        - contributor
        - totalPledged
        - refundedAmount
        - isFullyRefunded
    OpenIssue:
      type: object
      properties:
        id:
          type: string
          example: SGV-1
        title:
          type: string
          example: Implement Freighter-signed pledge transactions
        labels:
          type: array
          items:
            type: string
          example:
            - enhancement
            - soroban
        summary:
          type: string
          example: Replace mock API pledges with wallet-signed Soroban transactions.
        complexity:
          type: string
          enum:
            - Trivial
            - Medium
            - High
          example: High
        points:
          type: integer
          example: 200
      required:
        - id
        - title
        - labels
        - summary
        - complexity
        - points
    ApiError:
      type: object
      properties:
        success:
          type: boolean
          enum:
            - false
        error:
          type: object
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
              example: page must be a positive integer.
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                    example: page
                  message:
                    type: string
                    example: page must be a positive integer.
                required:
                  - field
                  - message
            requestId:
              type: string
              example: req-123
          required:
            - code
            - message
      required:
        - success
        - error
    CreateCampaignPayload:
      type: object
      properties:
        creator:
          type: string
          pattern: ^G[A-Z2-7]{55}$
        title:
          type: string
          minLength: 4
          maxLength: 80
        description:
          type: string
          minLength: 20
          maxLength: 500
        acceptedTokens:
          type: array
          items:
            type: string
            pattern: ^[A-Za-z0-9]{1,12}$
          minItems: 1
        targetAmount:
          type: number
          exclusiveMinimum: 0
        deadline:
          type: integer
          exclusiveMinimum: 0
        metadata:
          type: object
          properties:
            imageUrl:
              type: string
              maxLength: 2048
            externalLink:
              type: string
              maxLength: 2048
        maxPerContributor:
          type:
            - integer
            - "null"
          minimum: 0
      required:
        - creator
        - title
        - description
        - acceptedTokens
        - targetAmount
        - deadline
    CreatePledgePayload:
      type: object
      properties:
        contributor:
          type: string
          pattern: ^G[A-Z2-7]{55}$
        amount:
          type: number
          exclusiveMinimum: 0
        assetCode:
          type: string
          pattern: ^[A-Za-z0-9]{1,12}$
      required:
        - contributor
        - amount
        - assetCode
    ReconcilePledgePayload:
      type: object
      properties:
        contributor:
          type: string
          pattern: ^G[A-Z2-7]{55}$
        amount:
          type: number
          exclusiveMinimum: 0
        assetCode:
          type: string
          pattern: ^[A-Za-z0-9]{1,12}$
        transactionHash:
          type: string
          pattern: ^[A-Fa-f0-9]{64}$
        confirmedAt:
          type: integer
          exclusiveMinimum: 0
      required:
        - contributor
        - amount
        - assetCode
        - transactionHash
    ClaimCampaignPayload:
      type: object
      properties:
        creator:
          type: string
          pattern: ^G[A-Z2-7]{55}$
        transactionHash:
          type: string
          pattern: ^[A-Fa-f0-9]{64}$
        confirmedAt:
          type: integer
          exclusiveMinimum: 0
      required:
        - creator
        - transactionHash
    RefundPayload:
      type: object
      properties:
        contributor:
          type: string
          pattern: ^G[A-Z2-7]{55}$
        soroban:
          type: object
          properties:
            txHash:
              type: string
              pattern: ^[A-Fa-f0-9]{64}$
            contractId:
              type: string
              minLength: 1
            networkPassphrase:
              type: string
              minLength: 1
            rpcUrl:
              type: string
              format: uri
            walletAddress:
              type: string
              pattern: ^G[A-Z2-7]{55}$
            ledger:
              type: integer
              exclusiveMinimum: 0
            createdAt:
              type: integer
              exclusiveMinimum: 0
            latestLedger:
              type: integer
              exclusiveMinimum: 0
          required:
            - txHash
            - contractId
            - networkPassphrase
            - rpcUrl
            - walletAddress
      required:
        - contributor
        - soroban
    CampaignListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Campaign"
        pagination:
          type: object
          properties:
            total:
              type: integer
              description: Total number of items matching the query.
              example: 42
            page:
              type: integer
              description: Current page (1-based).
              example: 1
            limit:
              type: integer
              description: Number of items per page.
              example: 10
            totalPages:
              type: integer
              description: Total number of pages.
              example: 5
          required:
            - total
            - page
            - limit
            - totalPages
      required:
        - data
        - pagination
    CampaignDetailResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/Campaign"
      required:
        - data
    PledgeListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Pledge"
        pagination:
          type: object
          properties:
            total:
              type: integer
              description: Total number of items matching the query.
              example: 42
            page:
              type: integer
              description: Current page (1-based).
              example: 1
            limit:
              type: integer
              description: Number of items per page.
              example: 10
            totalPages:
              type: integer
              description: Total number of pages.
              example: 5
          required:
            - total
            - page
            - limit
            - totalPages
      required:
        - data
        - pagination
    PledgeResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/Campaign"
      required:
        - data
    ReconcileResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            campaign:
              $ref: "#/components/schemas/Campaign"
            transactionHash:
              type: string
              pattern: ^[A-Fa-f0-9]{64}$
              description: A 64-character hexadecimal transaction hash.
              example: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          required:
            - campaign
            - transactionHash
      required:
        - data
    RefundResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            id:
              type: string
              description: Numeric campaign identifier.
              example: "1"
            creator:
              type: string
              pattern: ^G[A-Z2-7]{55}$
              description: A 56-character Stellar public key (G...).
              example: GAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
            title:
              type: string
              example: Clean Water Initiative
            description:
              type: string
              example: Raising funds to provide clean water access.
            acceptedTokens:
              type: array
              items:
                type: string
                pattern: ^[A-Z0-9]{1,12}$
                description: Accepted Stellar asset code.
                example: USDC
              example: *a1
            assetCode:
              type: string
              pattern: ^[A-Z0-9]{1,12}$
              description: Primary asset code (backward compatibility).
              example: USDC
            targetAmount:
              type: number
              exclusiveMinimum: 0
              example: 1000
            pledgedAmount:
              type: number
              example: 455
            deadline:
              type: integer
              exclusiveMinimum: 0
              description: Unix timestamp in seconds.
              example: 1735689600
            createdAt:
              type: integer
              exclusiveMinimum: 0
              description: Unix timestamp in seconds.
              example: 1735689600
            claimedAt:
              type: integer
              exclusiveMinimum: 0
              description: Unix timestamp in seconds.
              example: 1735689600
            failedAt:
              type: integer
              exclusiveMinimum: 0
              description: Unix timestamp in seconds.
              example: 1735689600
            deletedAt:
              type: integer
              exclusiveMinimum: 0
              description: Unix timestamp in seconds.
              example: 1735689600
            metadata:
              type: object
              properties:
                imageUrl:
                  type: string
                  format: uri
                externalLink:
                  type: string
                  format: uri
              description: Optional campaign media / link metadata.
            maxPerContributor:
              type: integer
              exclusiveMinimum: 0
              example: 500
            tokenBalances:
              type: object
              additionalProperties:
                type: number
              example: *a2
            progress:
              $ref: "#/components/schemas/CampaignProgress"
            pledges:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: integer
                  campaignId:
                    type: string
                  contributor:
                    type: string
                    pattern: ^G[A-Z2-7]{55}$
                    description: A 56-character Stellar public key (G...).
                    example: GAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
                  amount:
                    type: number
                    exclusiveMinimum: 0
                  assetCode:
                    type: string
                    pattern: ^[A-Z0-9]{1,12}$
                    description: Accepted Stellar asset code.
                    example: USDC
                  createdAt:
                    type: integer
                    exclusiveMinimum: 0
                    description: Unix timestamp in seconds.
                    example: 1735689600
                  refundedAt:
                    type: integer
                    exclusiveMinimum: 0
                    description: Unix timestamp in seconds.
                    example: 1735689600
                  transactionHash:
                    type: string
                required:
                  - id
                  - campaignId
                  - contributor
                  - amount
                  - assetCode
                  - createdAt
              description: Recent pledges included on campaign detail responses.
            refundedAmount:
              type: number
              example: 50
          required:
            - id
            - creator
            - title
            - description
            - acceptedTokens
            - assetCode
            - targetAmount
            - pledgedAmount
            - deadline
            - createdAt
            - progress
            - refundedAmount
      required:
        - data
    ContributorSummaryResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ContributorSummary"
      required:
        - data
    CampaignHistoryResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/CampaignEvent"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
        hasMore:
          type: boolean
      required:
        - data
        - total
        - page
        - pageSize
        - hasMore
    HealthResponse:
      type: object
      properties:
        service:
          type: string
        status:
          type: string
          enum:
            - ok
            - degraded
        timestamp:
          type: string
          format: date-time
        uptimeSeconds:
          type: number
        database:
          type: object
          properties:
            reachable:
              type: boolean
            error:
              type: string
          required:
            - reachable
      required:
        - service
        - status
        - timestamp
        - uptimeSeconds
        - database
    DeepHealthResponse:
      type: object
      properties:
        overall:
          type: string
          enum:
            - up
            - down
        timestamp:
          type: string
          format: date-time
        uptimeSeconds:
          type: number
        components:
          type: object
          properties:
            db:
              type: object
              properties:
                status:
                  type: string
                  enum:
                    - up
                    - down
                details:
                  type: string
              required:
                - status
                - details
            soroban:
              type: object
              properties:
                status:
                  type: string
                  enum:
                    - up
                    - down
                details:
                  type: string
              required:
                - status
                - details
            contract:
              type: object
              properties:
                status:
                  type: string
                  enum:
                    - up
                    - down
                details:
                  type: string
              required:
                - status
                - details
          required:
            - db
            - soroban
            - contract
      required:
        - overall
        - timestamp
        - uptimeSeconds
        - components
    ConfigResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            allowedAssets:
              type: array
              items:
                type: string
                pattern: ^[A-Z0-9]{1,12}$
                description: Accepted Stellar asset code.
                example: USDC
            soroban:
              type: object
              properties:
                enabled:
                  type: boolean
                contractId:
                  type: string
                networkPassphrase:
                  type: string
                rpcUrl:
                  type: string
              required:
                - enabled
                - networkPassphrase
            sorobanRpcUrl:
              type: string
            contractId:
              type: string
            networkPassphrase:
              type: string
            contractAmountDecimals:
              type: integer
            walletIntegrationReady:
              type: boolean
            assetAddresses:
              type: object
              additionalProperties:
                type: string
          required:
            - allowedAssets
            - soroban
            - networkPassphrase
            - contractAmountDecimals
            - walletIntegrationReady
            - assetAddresses
      required:
        - data
    StatsResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            totalCampaigns:
              type: integer
            openCampaigns:
              type: integer
            fundedCampaigns:
              type: integer
            claimedCampaigns:
              type: integer
            failedCampaigns:
              type: integer
            totalPledgeVolume:
              type: number
            uniqueContributors:
              type: integer
          required:
            - totalCampaigns
            - openCampaigns
            - fundedCampaigns
            - claimedCampaigns
            - failedCampaigns
            - totalPledgeVolume
            - uniqueContributors
      required:
        - data
    LeaderboardResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/LeaderboardEntry"
      required:
        - data
    LeaderboardEntry:
      type: object
      properties:
        rank:
          type: integer
        contributor:
          type: string
          pattern: ^G[A-Z2-7]{55}$
          description: A 56-character Stellar public key (G...).
          example: GAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
        totalPledged:
          type: number
        campaignCount:
          type: integer
        averagePledgeAmount:
          type: number
      required:
        - rank
        - contributor
        - totalPledged
        - campaignCount
        - averagePledgeAmount
    OpenIssuesResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/OpenIssue"
      required:
        - data
    CreateApiKeyRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Production API Key
        scope:
          type: string
          enum:
            - read-only
            - read-write
          example: read-write
        expiresInDays:
          type: integer
          exclusiveMinimum: 0
          example: 90
      required:
        - name
        - scope
    ApiKeyResponse:
      type: object
      properties:
        id:
          type: string
          example: abc123def456
        name:
          type: string
          example: Production API Key
        keyPrefix:
          type: string
          example: sk_abc12
        scope:
          type: string
          enum:
            - read-only
            - read-write
        createdAt:
          type: integer
          exclusiveMinimum: 0
          description: Unix timestamp in seconds.
          example: 1735689600
        expiresAt:
          type:
            - integer
            - "null"
          exclusiveMinimum: 0
          description: Unix timestamp in seconds.
          example: 1735689600
        lastUsedAt:
          type:
            - integer
            - "null"
          exclusiveMinimum: 0
          description: Unix timestamp in seconds.
          example: 1735689600
      required:
        - id
        - name
        - keyPrefix
        - scope
        - createdAt
        - expiresAt
        - lastUsedAt
    CreatedApiKeyResponse:
      type: object
      properties:
        id:
          type: string
          example: abc123def456
        name:
          type: string
          example: Production API Key
        keyPrefix:
          type: string
          example: sk_abc12
        plainKey:
          type: string
          example: sk_abc12xyz789...
        scope:
          type: string
          enum:
            - read-only
            - read-write
        createdAt:
          type: integer
          exclusiveMinimum: 0
          description: Unix timestamp in seconds.
          example: 1735689600
        expiresAt:
          type:
            - integer
            - "null"
          exclusiveMinimum: 0
          description: Unix timestamp in seconds.
          example: 1735689600
      required:
        - id
        - name
        - keyPrefix
        - plainKey
        - scope
        - createdAt
        - expiresAt
    RotateApiKeyRequest:
      type: object
      properties:
        gracePeriodDays:
          type: integer
          exclusiveMinimum: 0
          example: 7
  parameters: {}
paths:
  /api/health:
    get:
      tags:
        - Health
      summary: Basic health check
      security: []
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Service is degraded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/health/deep:
    get:
      tags:
        - Health
      summary: Deep health check
      description: Checks database, Soroban RPC, and contract configuration health.
      security: []
      responses:
        "200":
          description: All components are healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeepHealthResponse"
        "503":
