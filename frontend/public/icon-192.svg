<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8d76b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0a500;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="vaultGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4fc3f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0288d1;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background rounded rect -->
  <rect width="192" height="192" rx="40" ry="40" fill="url(#bgGrad)" />
  <!-- Vault body -->
  <rect x="44" y="80" width="104" height="76" rx="10" ry="10" fill="url(#vaultGrad)" />
  <!-- Vault door top arch -->
  <path d="M 68 80 A 28 28 0 0 1 124 80" fill="#0277bd" />
  <!-- Vault handle / dial -->
  <circle cx="96" cy="116" r="18" fill="#01579b" stroke="#4fc3f7" stroke-width="3" />
  <circle cx="96" cy="116" r="8" fill="#4fc3f7" />
  <line x1="96" y1="98" x2="96" y2="108" stroke="#4fc3f7" stroke-width="2.5" stroke-linecap="round" />
  <line x1="96" y1="124" x2="96" y2="134" stroke="#4fc3f7" stroke-width="2.5" stroke-linecap="round" />
  <line x1="78" y1="116" x2="88" y2="116" stroke="#4fc3f7" stroke-width="2.5" stroke-linecap="round" />
  <line x1="104" y1="116" x2="114" y2="116" stroke="#4fc3f7" stroke-width="2.5" stroke-linecap="round" />
  <!-- Stellar star above vault -->
  <polygon points="96,28 102,48 122,48 106,60 112,80 96,68 80,80 86,60 70,48 90,48"
    fill="url(#starGrad)" />
</svg>
